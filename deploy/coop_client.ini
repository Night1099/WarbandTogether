[Coop]
Port=7240
HostIP=127.0.0.1
BattlePort=7241
Module=NativeCoop
; Join password for the whole pool (campaign + battle servers). Empty = open.
; Host: set it here. Joiners: type it into the MP browser's password box when
; joining, AND set the same value here so battle-server hops authenticate
; automatically (the hop cannot reuse what you typed in the browser).
; Max 47 characters -- longer values truncate on the battle-server hop.
Password=

[NetTuning]
; Read by the dedicated servers only -- harmless on a joiner install.
; AIMD congestion recovery. Stock: floor 3000, step 1000 (~97s recovery
; from the floor). Defaults tuned for 2-8 player coop (~10s recovery).
AimdFloor=16000
AimdStep=8000
; Max mbnet packet bytes. Stock 1350, but the measured Steam-tunnel
; per-packet budget is MTU_DataSize=1200 -- at 1350 every max-size world-sync
; packet ships as an all-or-nothing fragment pair. 1200 verified live:
; frag=0 both ends, no sync regression. Keep 1200.
PacketMaxSize=1200
; Campaign send-rate floor. 30 (stock) or 62 (62.5 Hz LAN profile).
SendRateHz=30

[Steam]
; Steam P2P tunnel (internet play with no port forwarding).
; While the bridge is up, hosts advertise a native Steam "Join Game" button
; on their friends list; joiners need zero Steam config here -- clicking the
; invite sets up the tunnel and the COOP Direct row appears in the MP
; browser's LAN tab.
; On the HOST machine set SteamHost=1 (and optionally AllowedSteamIDs -- an
; empty allowlist accepts ANY SteamID, so set a Password= above if you leave
; it empty):
; SteamHost=1
; AllowedSteamIDs=
; On JOINER machines set the host player's SteamID64 (17 digits):
; HostSteamID64=76561198000000000
; When set, HostIP above is ignored while Steam is running; if Steam is
; not running, the game falls back to HostIP (LAN/direct-IP).
; Optional: Debug=1 turns on the very chatty GameNetworkingSockets
; narration ([gns:] lines). Default logs warnings/errors only.
; Debug=1
