[Coop]
Port=7240
HostIP=127.0.0.1
BattlePort=7241
Module=NativeCoop
; Join password for the whole pool (campaign + battle servers). Empty = open.
; Host: set it here. Joiners: type it into the MP browser's password box when
; joining, AND set the same value here so battle-server hops authenticate
; automatically (the hop cannot reuse what you typed in the browser).
; Max 47 characters -- longer values truncate on the battle-server hop.
Password=

[NetTuning]
; AIMD congestion recovery (R2). Stock: floor 3000, step 1000 (~97s
; recovery from floor). Defaults tuned for 2-8 player coop (~10s recovery).
AimdFloor=16000
AimdStep=8000
; Max mbnet packet bytes (R3). Stock 1350, but the measured Steam-tunnel
; per-packet budget is MTU_DataSize=1200 -- at 1350 every max-size world-sync
; packet ships as an all-or-nothing fragment pair (frag>1300 counter climbs).
; 1200 verified live 2026-07-27: frag=0 both ends, no sync regression; on
; plain LAN the cost is a few percent more packets. Keep 1200.
PacketMaxSize=1200
; Campaign send-rate floor (R4). 30 (stock) or 62 (62.5 Hz LAN profile).
SendRateHz=30

[Steam]
; Steam P2P tunnel (internet play with no port forwarding).
; While the bridge is up, hosts advertise a native Steam "Join Game" button
; on their friends list; joiners need zero Steam config here -- clicking the
; invite sets up the tunnel and the COOP Direct row appears in the MP
; browser's LAN tab.
; (read by the client ASI only -- dedicated exes ignore this section)
; On the HOST machine set SteamHost=1. Find your SteamID64 at
; steamcommunity.com -> your profile -> right-click "Copy Page URL"
; (the 17-digit number), or via https://steamid.io.
; SteamHost=1
; Optional: only these SteamID64s may connect (comma-separated).
; Leave empty to accept anyone -- then SET A SERVER PASSWORD.
; AllowedSteamIDs=
; Optional: Debug=1 turns on the very chatty GameNetworkingSockets
; narration ([gns:] lines: rendezvous, relay pings). Default logs
; warnings/errors only.
; Debug=1
